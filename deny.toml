# cargo-deny 供应链门禁（实施 P0.1 / 架构 §14）。CI 每日跑，RUSTSEC 通告 48h 响应。
[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# 只放行明确许可；密码学依赖多为 Apache-2.0 / MIT / BSD
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016"]
confidence-threshold = 0.9

[bans]
# 依赖树膨胀预算：同一 crate 出现多版本要显式豁免（防供应链面扩大）
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

